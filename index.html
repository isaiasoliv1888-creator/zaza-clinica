<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ZAZA Clínica Dentista</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        
        <div class="logo-section">
            <img src="images/logo.png" alt="ZAZA Clínica Dentista" class="logo-image">
            <h1 class="clinic-name">ZAZA<span class="clinic-subtitle">Clínica Dentista</span></h1>
        </div>

        <h2 class="form-title">ENTRAR NA CONTA</h2>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-MAIL</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">SENHA</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePasswordVisibility()">&#128065;</span> </div>
            </div>

            <button type="submit" class="btn-primary">ENTRAR</button>
        </form>

        <div class="form-footer">
            <a href="#" class="footer-link">ESQUECEU A SENHA?</a>
            <div class="signup-prompt">
                <span>NÃO TEM CONTA?</span>
                <a href="#" class="btn-secondary">CRIAR NOVA CONTA</a>
            </div>
        </div>

        <div id="login-feedback"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
